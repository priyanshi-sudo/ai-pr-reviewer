[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-pr-reviewer"
version = "0.2.0"
description = "Structured, line-anchored LLM code review for GitHub pull requests"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "priyanshi-sudo" }]
keywords = ["github", "code-review", "llm", "ci", "pull-request"]
dependencies = [
  "click>=8.1",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "anthropic>=0.39",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
ai-pr-review = "ai_pr_reviewer.cli:main"

[project.urls]
Homepage = "https://github.com/priyanshi-sudo/ai-pr-reviewer"

[tool.hatch.build.targets.wheel]
packages = ["ai_pr_reviewer"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
